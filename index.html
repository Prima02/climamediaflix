<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=768,height=1152,initial-scale=1.0"/>
<title>MediaFlix Outdoor Clima</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    width:768px;
    height:1152px;
    overflow:hidden;
    background:#000000;
    color:white;
}

/* FUNDO */

.background-glow{
    position:absolute;
    width:100%;
    height:100%;
    background:
    radial-gradient(circle at top,
    rgba(255,0,0,0.12),
    transparent 45%);
    animation:bgPulse 6s ease-in-out infinite;
}

@keyframes bgPulse{

    0%{
        opacity:0.7;
    }

    50%{
        opacity:1;
    }

    100%{
        opacity:0.7;
    }

}

.container{
    position:relative;
    z-index:2;
    width:100%;
    height:100%;
    padding:40px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:center;
}

/* LOGO */

.logo-area{
    margin-top:5px;
    animation:logoFloat 5s ease-in-out infinite;
}

.logo-img{
    width:340px;
    height:auto;
    object-fit:contain;
}

@keyframes logoFloat{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-6px);
    }

    100%{
        transform:translateY(0px);
    }

}

/* RELÓGIO */

.clock{
    text-align:center;
    margin-top:10px;
}

.time{
    font-size:150px;
    font-weight:900;
    line-height:1;
    text-shadow:
    0 0 10px rgba(255,255,255,0.3),
    0 0 30px rgba(255,255,255,0.2);
    animation:clockGlow 3s ease-in-out infinite;
}

@keyframes clockGlow{

    0%{
        opacity:1;
    }

    50%{
        opacity:0.92;
    }

    100%{
        opacity:1;
    }

}

.date{
    font-size:24px;
    opacity:0.55;
    margin-top:12px;
    text-transform:capitalize;
    letter-spacing:2px;
}

/* CLIMA */

.weather{
    text-align:center;
}

.icon{
    font-size:200px;
    margin-bottom:20px;
    animation:weatherFloat 4s ease-in-out infinite;
    filter:drop-shadow(0 0 18px rgba(255,255,255,0.15));
}

@keyframes weatherFloat{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-12px);
    }

    100%{
        transform:translateY(0px);
    }

}

.temp{
    font-size:240px;
    font-weight:900;
    line-height:1;
    text-shadow:
    0 0 25px rgba(255,255,255,0.15);
    animation:tempPulse 4s ease-in-out infinite;
}

@keyframes tempPulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.02);
    }

    100%{
        transform:scale(1);
    }

}

.city{
    font-size:52px;
    margin-top:10px;
    font-weight:bold;
    letter-spacing:4px;
}

.condition{
    font-size:34px;
    opacity:0.85;
    margin-top:12px;
    font-weight:bold;
}

/* RODAPÉ */

.footer{
    text-align:center;
    width:100%;
    margin-bottom:20px;
}

.minmax{
    font-size:28px;
    opacity:0.75;
    margin-bottom:18px;
    letter-spacing:2px;
}

.brand{
    font-size:12px;
    opacity:0.2;
    letter-spacing:5px;
}

.red-line{
    width:100%;
    height:12px;
    background:#ff1a1a;
    border-radius:999px;
    margin-top:16px;
    animation:redGlow 2s linear infinite;
}

@keyframes redGlow{

    0%{
        box-shadow:0 0 8px #ff1a1a;
    }

    50%{
        box-shadow:0 0 30px #ff1a1a;
    }

    100%{
        box-shadow:0 0 8px #ff1a1a;
    }

}

</style>
</head>

<body>

<div class="background-glow"></div>

<div class="container">

    <!-- LOGO -->

    <div class="logo-area">

        <img src="Logo.png" class="logo-img">

    </div>

    <!-- RELÓGIO -->

    <div class="clock">

        <div class="time" id="time">
            00:00
        </div>

        <div class="date" id="date">
            Carregando...
        </div>

    </div>

    <!-- CLIMA -->

    <div class="weather">

        <div class="icon" id="icon">
            ☀️
        </div>

        <div class="temp" id="temp">
            --°
        </div>

        <div class="city">
            OURO PRETO
        </div>

        <div class="condition" id="condition">
            Carregando clima...
        </div>

    </div>

    <!-- RODAPÉ -->

    <div class="footer">

        <div class="minmax" id="minmax">
            MÍN --° • MÁX --°
        </div>

        <div class="brand">
            MEDIAFLIX
        </div>

        <div class="red-line"></div>

    </div>

</div>

<script>

/* RELÓGIO */

function updateClock(){

    const now = new Date();

    const time = now.toLocaleTimeString('pt-BR',{
        hour:'2-digit',
        minute:'2-digit'
    });

    const date = now.toLocaleDateString('pt-BR',{
        weekday:'long',
        day:'2-digit',
        month:'long'
    });

    document.getElementById('time').innerText = time;
    document.getElementById('date').innerText = date;

}

setInterval(updateClock,1000);

updateClock();


/* CLIMA */

async function getWeather(){

    try{

        const url =
        "https://api.open-meteo.com/v1/forecast?latitude=-20.3856&longitude=-43.5036&current_weather=true&daily=temperature_2m_max,temperature_2m_min&timezone=America/Sao_Paulo";

        const response = await fetch(url);

        const data = await response.json();

        const temp =
        Math.round(data.current_weather.temperature);

        const weatherCode =
        data.current_weather.weathercode;

        const max =
        Math.round(data.daily.temperature_2m_max[0]);

        const min =
        Math.round(data.daily.temperature_2m_min[0]);

        let icon = "☀️";

        let condition = "ENSOLARADO";

        if([1,2].includes(weatherCode)){
            icon = "🌤️";
            condition = "PARCIALMENTE NUBLADO";
        }

        if([3].includes(weatherCode)){
            icon = "☁️";
            condition = "NUBLADO";
        }

        if([45,48].includes(weatherCode)){
            icon = "🌫️";
            condition = "NEBLINA";
        }

        if([51,53,55,61,63,65,80,81,82].includes(weatherCode)){
            icon = "🌧️";
            condition = "CHUVA";
        }

        if([95,96,99].includes(weatherCode)){
            icon = "⛈️";
            condition = "TEMPESTADE";
        }

        document.getElementById('temp').innerText =
        temp + "°";

        document.getElementById('condition').innerText =
        condition;

        document.getElementById('icon').innerText =
        icon;

        document.getElementById('minmax').innerText =
        "MÍN " + min + "° • MÁX " + max + "°";

    }catch(error){

        console.log(error);

        document.getElementById('condition').innerText =
        "SEM CONEXÃO";

    }

}

getWeather();

// Atualiza clima a cada 10 minutos

setInterval(getWeather,600000);

</script>

</body>
</html>
