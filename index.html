<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=768,height=1152,initial-scale=1.0"/>
<title>MediaFlix Clima</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    width:768px;
    height:1152px;
    overflow:hidden;
    background:#000000;
    color:white;
}

.container{
    width:100%;
    height:100%;
    padding:50px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

/* ANIMAÇÃO GERAL */

.fade-in{
    animation:fadeIn 1.2s ease;
}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* LOGO */

.logo-area{
    text-align:center;
    margin-top:10px;
    animation:pulseLogo 4s ease-in-out infinite;
}

.logo-img{
    width:420px;
    height:auto;
    object-fit:contain;
}

@keyframes pulseLogo{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.03);
    }

    100%{
        transform:scale(1);
    }

}

/* RELÓGIO */

.clock{
    text-align:center;
    margin-top:20px;
}

.time{
    font-size:130px;
    font-weight:bold;
    line-height:1;
    animation:glow 2s ease-in-out infinite;
}

.date{
    font-size:28px;
    opacity:0.75;
    margin-top:12px;
    text-transform:capitalize;
}

@keyframes glow{

    0%{
        text-shadow:0 0 10px rgba(255,255,255,0.2);
    }

    50%{
        text-shadow:0 0 30px rgba(255,255,255,0.7);
    }

    100%{
        text-shadow:0 0 10px rgba(255,255,255,0.2);
    }

}

/* CLIMA */

.weather{
    text-align:center;
}

.icon{
    font-size:180px;
    margin-bottom:25px;
    animation:float 4s ease-in-out infinite;
}

@keyframes float{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-15px);
    }

    100%{
        transform:translateY(0px);
    }

}

.temp{
    font-size:200px;
    font-weight:bold;
    line-height:1;
    animation:fadeTemp 3s ease-in-out infinite;
}

@keyframes fadeTemp{

    0%{
        opacity:1;
    }

    50%{
        opacity:0.85;
    }

    100%{
        opacity:1;
    }

}

.city{
    font-size:48px;
    margin-top:18px;
    font-weight:bold;
}

.condition{
    font-size:38px;
    opacity:0.9;
    margin-top:14px;
}

/* RODAPÉ */

.footer{
    text-align:center;
    margin-bottom:30px;
}

.minmax{
    font-size:32px;
    margin-bottom:14px;
    opacity:0.9;
}

.brand{
    font-size:14px;
    opacity:0.35;
    letter-spacing:2px;
}

.red-line{
    width:100%;
    height:10px;
    background:#ff1a1a;
    border-radius:999px;
    margin-top:18px;
    animation:redGlow 2s linear infinite;
}

@keyframes redGlow{

    0%{
        box-shadow:0 0 5px #ff1a1a;
    }

    50%{
        box-shadow:0 0 25px #ff1a1a;
    }

    100%{
        box-shadow:0 0 5px #ff1a1a;
    }

}

</style>
</head>

<body>

<div class="container fade-in">

    <!-- TOPO -->

    <div>

        <div class="logo-area">

            <img src="Logo.png" class="logo-img">

        </div>

        <!-- RELÓGIO -->

        <div class="clock">

            <div class="time" id="time">
                00:00
            </div>

            <div class="date" id="date">
                Carregando...
            </div>

        </div>

    </div>

    <!-- CLIMA -->

    <div class="weather">

        <div class="icon" id="icon">
            ☀️
        </div>

        <div class="temp" id="temp">
            --°
        </div>

        <div class="city">
            Ouro Preto
        </div>

        <div class="condition" id="condition">
            Carregando clima...
        </div>

    </div>

    <!-- RODAPÉ -->

    <div class="footer">

        <div class="minmax" id="minmax">
            Mín --° | Máx --°
        </div>

        <div class="brand">
            MEDIAFLIX
        </div>

        <div class="red-line"></div>

    </div>

</div>

<script>

/* RELÓGIO */

function updateClock(){

    const now = new Date();

    const time = now.toLocaleTimeString('pt-BR',{
        hour:'2-digit',
        minute:'2-digit'
    });

    const date = now.toLocaleDateString('pt-BR',{
        weekday:'long',
        day:'2-digit',
        month:'long'
    });

    document.getElementById('time').innerText = time;
    document.getElementById('date').innerText = date;

}

setInterval(updateClock,1000);

updateClock();


/* CLIMA */

async function getWeather(){

    try{

        const url =
        "https://api.open-meteo.com/v1/forecast?latitude=-20.3856&longitude=-43.5036&current_weather=true&daily=temperature_2m_max,temperature_2m_min&timezone=America/Sao_Paulo";

        const response = await fetch(url);

        const data = await response.json();

        const temp =
        Math.round(data.current_weather.temperature);

        const weatherCode =
        data.current_weather.weathercode;

        const max =
        Math.round(data.daily.temperature_2m_max[0]);

        const min =
        Math.round(data.daily.temperature_2m_min[0]);

        let icon = "☀️";

        let condition = "Ensolarado";

        // CÓDIGOS CLIMA

        if([1,2].includes(weatherCode)){
            icon = "🌤️";
            condition = "Parcialmente nublado";
        }

        if([3].includes(weatherCode)){
            icon = "☁️";
            condition = "Nublado";
        }

        if([45,48].includes(weatherCode)){
            icon = "🌫️";
            condition = "Neblina";
        }

        if([51,53,55,61,63,65,80,81,82].includes(weatherCode)){
            icon = "🌧️";
            condition = "Chuva";
        }

        if([95,96,99].includes(weatherCode)){
            icon = "⛈️";
            condition = "Tempestade";
        }

        document.getElementById('temp').innerText =
        temp + "°";

        document.getElementById('condition').innerText =
        condition;

        document.getElementById('icon').innerText =
        icon;

        document.getElementById('minmax').innerText =
        "Mín " + min + "° | Máx " + max + "°";

    }catch(error){

        console.log(error);

        document.getElementById('condition').innerText =
        "Sem conexão";

    }

}

getWeather();

// Atualiza clima a cada 10 minutos

setInterval(getWeather,600000);

</script>

</body>
</html>
